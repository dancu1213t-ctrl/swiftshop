<!doctype html><html class="swift-design"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="customer-usability.css"><style>body{font:16px system-ui;margin:0;background:#f6f7f3;color:#203027}.preview{padding:24px;max-width:580px;margin:auto}button{min-height:44px;padding:10px;border:1px solid #ddd;border-radius:12px;background:white;font:inherit}.preview p{line-height:1.6}input{padding:14px;width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:12px}.swift-review-dialog{font-family:system-ui}</style><script>const customerDataClient={rpc(name){return {abortSignal:async()=>({data:name==='swift_order_review_targets'?[{kind:'store',key:'Store feedback',stars:null},{kind:'runner',key:'Runner feedback',stars:null}]:[]})}}};</script><script src="customer-reviews.js" defer></script><script src="customer-usability.js" defer></script></head><body><main class="preview"><h1>Customer feedback</h1><p>Layout preview · No ratings are sent or recorded.</p><button onclick="document.querySelector('dialog').showModal()">Open feedback</button><p><label>Keyboard spacing check<input placeholder="Check keyboard spacing"></label></p></main><dialog class="swift-review-dialog"><header><h2>Order completed</h2><button data-close aria-label="Close feedback" onclick="this.closest('dialog').close()">✕</button></header><div id="reviewHost"></div></dialog><script>addEventListener('DOMContentLoaded',()=>{SwiftReviews.update(document.getElementById('reviewHost'),{id:'preview',completed:true});document.querySelector('dialog').showModal()})</script></body></html>
